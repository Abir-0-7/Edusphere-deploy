    "description": "Generated from FastAPI response/request models with python -m scripts.export_openapi. Scope: learner profiles, optional diagnostics, learning JSON, summary/TTS streams, focus, progress, plans, bibliography records, pinned source versions and academic tools. Named/data SSE event payloads are documented in x-event-schemas. Health and privacy export remain in the runtime /openapi.json. Requests are authenticated with a Clerk bearer token."
