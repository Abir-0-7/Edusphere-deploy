name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyvault_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: studyvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studyvault_test -d studyvault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Forked PRs use placeholders; repository secrets enable the authenticated
      # Clerk learning-loop spec without putting credentials in source control.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_placeholder' }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL || '' }}
      DATABASE_URL: postgresql://user:pass@localhost:5432/studyvault
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_INTERNAL_TOKEN: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No `version:` here — the action reads `packageManager` from package.json.
        # Passing both is an error ("Multiple versions of pnpm specified").
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studyvault/game-engine build
      # Run directly so Turbo cannot omit the test URL or replay cached skips.
      - name: PostgreSQL Game Vault integration
        run: |
          pnpm --filter @studyvault/web exec vitest run tests/game-sessions-pg.test.ts
          pnpm --filter @studyvault/web exec vitest run tests/cyberverse-pg.test.ts
          pnpm --filter @studyvault/realtime exec vitest run tests/postgres.test.ts
        env:
          STUDYVAULT_TEST_DATABASE_URL: postgresql://studyvault_test:test_only@127.0.0.1:5432/studyvault_test
      - run: pnpm --filter @studyvault/web exec playwright install --with-deps chromium
      # Exercise the actual player with deterministic fixtures on forked PRs too.
      - run: pnpm --filter @studyvault/web test:e2e:games
      - run: pnpm --filter @studyvault/web test:e2e:flashcard-studio
      - run: pnpm --filter @studyvault/web test:e2e:offline-decks
      - run: pnpm --filter @studyvault/web test:e2e:maps
      - run: pnpm --filter @studyvault/web test:e2e:cover-builder
      - run: pnpm --filter @studyvault/web test:e2e:bibliography
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Playwright starts the production server on an explicit IPv4 listener in CI.
      - run: pnpm --filter @studyvault/web test:e2e
        env:
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
          NO_PROXY: localhost,127.0.0.1
          no_proxy: localhost,127.0.0.1
        # Without the optional Clerk secrets, the signed-in spec skips and the
        # anonymous guards still validate route protection.

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyvault_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: studyvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studyvault_test -d studyvault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults: { run: { working-directory: apps/ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q
      - name: Academic tools and source-backed course PostgreSQL checks
        run: >-
          pytest -q tests/test_bibliography.py tests/test_source_versions_pg.py
          tests/test_phase8ef_migrations_pg.py tests/test_github_import_pg.py
          tests/test_course_outlines_pg.py tests/test_course_generation_pg.py
          tests/test_source_refresh_pg.py tests/test_full_course_progress.py
          tests/test_course_upgrades.py tests/test_local_text_source_pg.py
        env:
          STUDYVAULT_TEST_DATABASE_URL: postgresql://studyvault_test:test_only@127.0.0.1:5432/studyvault_test
